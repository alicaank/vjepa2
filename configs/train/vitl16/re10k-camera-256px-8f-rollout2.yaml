app: vjepa_camera_re10k
cpus_per_task: 8
folder: /home/ak/GWM/predictor_output_rollout2
mem_per_gpu: 80G
nodes: 2
tasks_per_node: 8
data:
  data_root: /home/ak/GWM/dataset/re10k
  batch_size: 4
  crop_size: 384
  patch_size: 16
  # V-JEPA 2.1 image-path: tubelet_size=1 means each frame is encoded independently
  # via patch_embed_img (img_temporal_dim_size=1). Temporal dynamics live in the
  # predictor only, not in the encoder's tubelet convolution.
  tubelet_size: 1
  seq_len: 8          # temporal frames per clip (each is one image-path tubelet)
  stride: 4
  min_stride: 1
  stride_values: [1, 2, 4, 8]
  n_ctx_tubelets: 1
  ar_random_context: true
  ar_random_local_window: false
  min_ctx_tubelets: 1
  # rollout_train_steps=2 requires total_tubelets - rollout_train_steps >= max_ctx_tubelets;
  # total_tubelets=8, so max_ctx_tubelets<=6. Capped at 3 to match the 1-step config's
  # ablation surface and keep the effective local window comparable.
  max_ctx_tubelets: 3
  n_motion_eval_scenes: 64
  n_fixed_stride_eval_scenes: 32
  eval_stride_small: 1
  eval_stride_medium: 4
  eval_stride_large: 8
  num_workers: 8
  pin_mem: true
  persistent_workers: true
loss:
  loss_exp: 1.0
  normalize_reps: true
  context_loss_weight: 0.0
  # Two-step rollout: the predictor must produce tubelet t+1 AND t+2, where the
  # t+2 prediction is conditioned on the predictor's own t+1 output (not on the
  # teacher-forced target). Per-step weight is rollout_loss_decay^step.
  rollout_train_steps: 2
  rollout_loss_decay: 0.5
meta:
  dtype: bfloat16
  resume_checkpoint: null
  load_predictor: false
  load_encoder: true
  pretrain_checkpoint: https://dl.fbaipublicfiles.com/vjepa2/vjepa2_1_vitl_dist_vitG_384.pt
  context_encoder_key: ema_encoder
  target_encoder_key: ema_encoder
  save_every_freq: 10
  checkpoint_save_mode: weights_only_no_target
  seed: 42
  use_sdpa: true
  sync_gc: false
model:
  model_name: vit_large
  pred_depth: 12
  pred_embed_dim: 1024
  pred_num_heads: 16
  pred_is_frame_causal: true
  uniform_power: true
  use_activation_checkpointing: true
  use_rope: true
  use_silu: false
  use_pred_silu: false
  wide_silu: true
  n_hierarchical_layers: 4
  state_dim: 7
  action_dim: 7
  intrinsics_dim: 4
  use_intrinsics: true
  predict_all: false
  use_ray_pe: true
  ray_pe_dim: 6
  ray_pe_hidden: 256
  use_delta_head: true
  delta_loss_weight: 0.25
  use_residual_head: true
  residual_head_depth: 2
  residual_head_ratio: 2.0
optimization:
  anneal: 15
  epochs: 50
  final_lr: 0.0
  final_weight_decay: 0.04
  ipe: 100
  lr: 0.0003
  start_lr: 0.00005
  warmup: 10
  weight_decay: 0.04
  enc_lr_scale: 0.1
  betas:
  - 0.9
  - 0.999
  eps: 1.0e-8
